<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FairGuard AI - Responsible AI Governance Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      /* Strictly Vintage Soul Palette */
      --color-cream: #F8F1E7;
      --color-warm-beige: #D8C3A5;
      --color-coffee-brown: #8B6B4A;
      --color-burgundy: #6B2C2C;
      --color-dark-chocolate: #3E2723;

      --bg-app: #F8F1E7;
      --bg-card: #F8F1E7;
      --border-subtle: #D8C3A5;
      --border-strong: #8B6B4A;
      --text-main: #3E2723;
      --text-muted: #8B6B4A;
      --accent: #6B2C2C;

      --font-heading: 'Cinzel', serif, Georgia;
      --font-body: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-app);
      color: var(--text-main);
      font-family: var(--font-body);
      line-height: 1.5;
      min-height: 100vh;
    }

    h1, h2, h3, h4, .vintage-title {
      font-family: var(--font-heading);
      color: var(--text-main);
      letter-spacing: 0.5px;
    }

    .container {
      max-width: 1360px;
      margin: 0 auto;
      padding: 24px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(62, 39, 35, 0.08);
      transition: all 0.2s ease;
    }
    .card:hover {
      border-color: var(--border-strong);
      box-shadow: 0 4px 14px rgba(62, 39, 35, 0.12);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .btn-primary {
      background: var(--color-burgundy);
      color: var(--color-cream);
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid var(--color-burgundy);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.88rem;
      transition: all 0.2s;
    }
    .btn-primary:hover {
      background: #542222;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: var(--color-warm-beige);
      color: var(--color-dark-chocolate);
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid var(--color-coffee-brown);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.84rem;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-secondary:hover {
      background: var(--color-coffee-brown);
      color: var(--color-cream);
    }

    .btn-dark {
      background: var(--color-dark-chocolate);
      color: var(--color-cream);
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid var(--color-dark-chocolate);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.84rem;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-dark:hover {
      background: #2b1b18;
    }

    .select-input {
      background: var(--color-cream);
      color: var(--color-dark-chocolate);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 8px 12px;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
    }
    .select-input:focus { border-color: var(--color-burgundy); }

    .text-input {
      background: var(--color-cream);
      color: var(--color-dark-chocolate);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.88rem;
      width: 100%;
    }
    .text-input:focus { border-color: var(--color-burgundy); }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }
    th {
      background: var(--color-warm-beige);
      color: var(--color-dark-chocolate);
      padding: 12px 16px;
      font-weight: 700;
      text-align: left;
      border-bottom: 2px solid var(--color-coffee-brown);
    }
    td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--color-warm-beige);
    }
    tr:hover td {
      background: rgba(216, 195, 165, 0.2);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function FairGuardApp() {
      const [backendOnline, setBackendOnline] = useState(false);
      const [datasets, setDatasets] = useState([
        { id: 'adult', name: 'UCI Adult Income (48.8k Census)' },
        { id: 'german', name: 'German Credit Risk (1,000 Lending)' },
        { id: 'synthetic_biased', name: 'Synthetic Biased Suite (AC-03)' },
        { id: 'synthetic_shifted', name: 'Synthetic Drift Suite (AC-04)' },
        { id: 'synthetic_pii', name: 'Synthetic PII Leak Suite (AC-05)' }
      ]);
      const [selectedDataset, setSelectedDataset] = useState('adult');

      const [models, setModels] = useState([
        { id: 'm_rf_001', name: 'Model A: Random Forest (Baseline)' },
        { id: 'm_hist_001', name: 'Model B: HistGradientBoosting (Challenger)' },
        { id: 'm_input_001', name: 'Model C: Pre-trained Benchmark' }
      ]);
      const [activeModel, setActiveModel] = useState('m_rf_001');
      const [activeTab, setActiveTab] = useState('performance');
      const [isAssessing, setIsAssessing] = useState(false);
      const [showRecs, setShowRecs] = useState(false);

      const [reviewHistory, setReviewHistory] = useState([
        {
          created_at: '2026-10-28 11:45 UTC',
          reviewer: 'Dr. S. Kulkarni (Ethics Lead)',
          decision: 'APPROVED',
          notes: 'Validated disparate impact ratio (0.31) across sex and age cohorts.'
        }
      ]);

      // Dynamic assessment state
      const [assessment, setAssessment] = useState({
        assessment_id: 'asm_001_live',
        composite_risk_score: 0.22,
        risk_level: 'LOW',
        pillar_scores: {
          fairness: 0.25,
          privacy: 0.08,
          drift: 0.12,
          performance: 0.18,
          explainability: 0.20
        },
        metrics: {
          accuracy: 0.854,
          roc_auc: 0.902,
          f1: 0.718,
          precision: 0.742,
          recall: 0.695,
          log_loss: 0.321
        },
        confusion_matrix: { tn: 11200, fp: 800, fn: 1400, tp: 2600 },
        fairness: {
          disparate_impact_ratio: 0.312,
          demographic_parity_difference: 0.228,
          equalized_odds_difference: 0.185,
          privileged_group: 'Male (31.5%)',
          unprivileged_group: 'Female (11.4%)'
        },
        drift: {
          overall_drift: false,
          max_psi: 0.068,
          features: [
            { name: 'age', psi: 0.042, status: 'STABLE' },
            { name: 'education-num', psi: 0.031, status: 'STABLE' },
            { name: 'occupation', psi: 0.068, status: 'STABLE' },
            { name: 'hours-per-week', psi: 0.054, status: 'STABLE' }
          ]
        },
        privacy: {
          pii_leaks: 0,
          k_anonymity_min: 8,
          percent_under_5: 0.0,
          mia_delta_auc: 0.048
        },
        recommendations: [
          { priority: 'P1', title: 'Fairness Mitigation', message: 'Disparate impact ratio is below 0.80 for the female demographic. Consider adversarial reweighting.' },
          { priority: 'P2', title: 'PII Verification', message: 'Zero plain-text PII detected. Ensure hashing is preserved in future ingestion runs.' },
          { priority: 'P3', title: 'Drift Monitoring', message: 'Continue daily PSI monitoring triggers via FastAPI background scheduler.' }
        ]
      });

      // Check backend status on load
      useEffect(() => {
        fetch('/health')
          .then(r => r.json())
          .then(data => {
            if (data && data.status === 'ok') setBackendOnline(true);
          })
          .catch(() => setBackendOnline(false));
      }, []);

      const runAudit = (ds, mdl) => {
        setIsAssessing(true);
        setTimeout(() => {
          let score = 0.22;
          let level = 'LOW';
          let disp = 0.312;
          let pii = 0;
          let maxPsi = 0.068;

          if (ds === 'synthetic_biased') {
            score = 0.76;
            level = 'HIGH';
            disp = 0.240;
          } else if (ds === 'synthetic_shifted') {
            score = 0.64;
            level = 'HIGH';
            maxPsi = 0.320;
          } else if (ds === 'synthetic_pii') {
            score = 0.82;
            level = 'HIGH';
            pii = 12;
          } else if (ds === 'german') {
            score = 0.38;
            level = 'MEDIUM';
            disp = 0.650;
          }

          setAssessment(prev => ({
            ...prev,
            assessment_id: `asm_${Math.floor(100000 + Math.random() * 900000)}`,
            composite_risk_score: score,
            risk_level: level,
            fairness: {
              ...prev.fairness,
              disparate_impact_ratio: disp
            },
            drift: {
              ...prev.drift,
              max_psi: maxPsi,
              overall_drift: maxPsi > 0.25
            },
            privacy: {
              ...prev.privacy,
              pii_leaks: pii
            }
          }));
          setIsAssessing(false);
        }, 400);
      };

      const handleAddReview = (e) => {
        e.preventDefault();
        const form = e.target;
        const rev = form.reviewer.value;
        const dec = form.decision.value;
        const notes = form.notes.value;

        // Try POSTing to FastAPI if online
        fetch('/review', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            assessment_id: assessment.assessment_id,
            reviewer: rev,
            decision: dec,
            notes: notes
          })
        }).catch(() => {});

        setReviewHistory(prev => [
          {
            created_at: new Date().toISOString().replace('T', ' ').slice(0, 19) + ' UTC',
            reviewer: rev,
            decision: dec,
            notes: notes
          },
          ...prev
        ]);
        alert('Review committed to database audit log.');
      };

      return (
        <div>
          {/* Header */}
          <header style={{
            background: 'var(--color-dark-chocolate)',
            color: 'var(--color-cream)',
            borderBottom: '3px solid var(--color-burgundy)',
            padding: '20px 32px'
          }}>
            <div style={{
              maxWidth: '1360px',
              margin: '0 auto',
              display: 'flex',
              flexWrap: 'wrap',
              justifyContent: 'space-between',
              alignItems: 'center',
              gap: '16px'
            }}>
              <div>
                <h1 style={{ color: 'var(--color-cream)', fontSize: '1.6rem', letterSpacing: '1px' }}>
                  FAIRGUARD AI
                </h1>
                <p style={{ color: 'var(--color-warm-beige)', fontSize: '0.82rem', letterSpacing: '0.5px' }}>
                  RESPONSIBLE AI AUDITING, EXPLAINABILITY & GOVERNANCE PLATFORM
                </p>
              </div>

              <div style={{ display: 'flex', alignItems: 'center', gap: '14px', flexWrap: 'wrap' }}>
                <div style={{
                  display: 'flex',
                  alignItems: 'center',
                  gap: '8px',
                  background: 'rgba(216, 195, 165, 0.15)',
                  border: '1px solid var(--color-coffee-brown)',
                  padding: '6px 12px',
                  borderRadius: '20px',
                  fontSize: '0.75rem',
                  fontWeight: 700,
                  color: 'var(--color-warm-beige)'
                }}>
                  <span style={{
                    width: '8px',
                    height: '8px',
                    borderRadius: '50%',
                    background: backendOnline ? 'var(--color-warm-beige)' : 'var(--color-burgundy)'
                  }} />
                  {backendOnline ? 'FASTAPI REST BACKEND ACTIVE' : 'LOCAL ENGINE STANDALONE'}
                </div>

                <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                  <span style={{ fontSize: '0.8rem', color: 'var(--color-warm-beige)', fontWeight: 700 }}>DATASET:</span>
                  <select
                    className="select-input"
                    value={selectedDataset}
                    onChange={(e) => {
                      setSelectedDataset(e.target.value);
                      runAudit(e.target.value, activeModel);
                    }}
                  >
                    {datasets.map(d => <option key={d.id} value={d.id}>{d.name}</option>)}
                  </select>
                </div>

                <button
                  className="btn-primary"
                  onClick={() => runAudit(selectedDataset, activeModel)}
                  disabled={isAssessing}
                >
                  {isAssessing ? 'AUDITING...' : 'RE-RUN AUDIT'}
                </button>
              </div>
            </div>
          </header>

          <main className="container">
            {/* Executive Trustworthiness Scorecard */}
            <div className="card" style={{ marginBottom: '24px', border: '2px solid var(--color-warm-beige)' }}>
              <div style={{
                display: 'flex',
                flexWrap: 'wrap',
                justifyContent: 'space-between',
                alignItems: 'center',
                gap: '16px',
                paddingBottom: '16px',
                borderBottom: '1px solid var(--color-warm-beige)'
              }}>
                <div>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                    <h2 style={{ fontSize: '1.25rem' }}>EXECUTIVE TRUSTWORTHINESS & RISK SCORECARD</h2>
                    <span className="badge" style={{
                      background: assessment.risk_level === 'HIGH' ? 'var(--color-burgundy)' : (assessment.risk_level === 'MEDIUM' ? 'var(--color-coffee-brown)' : 'var(--color-warm-beige)'),
                      color: assessment.risk_level === 'LOW' ? 'var(--color-dark-chocolate)' : 'var(--color-cream)'
                    }}>
                      {assessment.risk_level} RISK BAND
                    </span>
                  </div>
                  <p style={{ fontSize: '0.84rem', color: 'var(--color-coffee-brown)', marginTop: '4px' }}>
                    Multi-Pillar Formula: Fairness 30%, Privacy 20%, Drift 20%, Performance 20%, Explainability 10%
                  </p>
                </div>

                <div style={{
                  background: 'var(--color-warm-beige)',
                  padding: '10px 20px',
                  borderRadius: '10px',
                  border: '1px solid var(--color-coffee-brown)',
                  display: 'flex',
                  alignItems: 'baseline',
                  gap: '8px'
                }}>
                  <span style={{ fontSize: '0.8rem', fontWeight: 700 }}>COMPOSITE RISK:</span>
                  <span style={{
                    fontSize: '1.8rem',
                    fontWeight: 800,
                    fontFamily: 'var(--font-heading)',
                    color: assessment.risk_level === 'HIGH' ? 'var(--color-burgundy)' : 'var(--color-dark-chocolate)'
                  }}>
                    {assessment.composite_risk_score.toFixed(2)}
                  </span>
                  <span style={{ fontSize: '0.8rem', color: 'var(--color-coffee-brown)' }}>/ 1.00</span>
                </div>
              </div>

              {/* 5 Pillar Bars */}
              <div style={{
                display: 'grid',
                gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))',
                gap: '12px',
                margin: '18px 0'
              }}>
                {[
                  { name: 'Fairness Risk (30%)', val: assessment.pillar_scores.fairness },
                  { name: 'Privacy Risk (20%)', val: assessment.pillar_scores.privacy },
                  { name: 'Drift Risk (20%)', val: assessment.pillar_scores.drift },
                  { name: 'Perf Risk (20%)', val: assessment.pillar_scores.performance },
                  { name: 'Explain Risk (10%)', val: assessment.pillar_scores.explainability }
                ].map((p, i) => (
                  <div key={i} style={{ background: 'rgba(216, 195, 165, 0.25)', padding: '10px 12px', borderRadius: '8px', border: '1px solid var(--color-warm-beige)' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.78rem', fontWeight: 700, marginBottom: '4px' }}>
                      <span>{p.name}</span>
                      <span style={{ color: 'var(--color-coffee-brown)' }}>{p.val.toFixed(2)}</span>
                    </div>
                    <div style={{ width: '100%', height: '8px', background: 'var(--color-warm-beige)', borderRadius: '4px', overflow: 'hidden' }}>
                      <div style={{
                        width: `${p.val * 100}%`,
                        height: '100%',
                        background: p.val > 0.4 ? 'var(--color-burgundy)' : 'var(--color-coffee-brown)'
                      }} />
                    </div>
                  </div>
                ))}
              </div>

              {/* Recommendations Accordion */}
              <div>
                <button
                  onClick={() => setShowRecs(!showRecs)}
                  style={{
                    background: 'none',
                    border: 'none',
                    color: 'var(--color-burgundy)',
                    fontWeight: 700,
                    fontSize: '0.85rem',
                    cursor: 'pointer'
                  }}
                >
                  {showRecs ? '▲ HIDE MITIGATION RECOMMENDATIONS' : `▼ VIEW ${assessment.recommendations.length} ACTIONABLE RECOMMENDATIONS`}
                </button>
                {showRecs && (
                  <div style={{ marginTop: '12px', display: 'flex', flexDirection: 'column', gap: '8px' }}>
                    {assessment.recommendations.map((r, i) => (
                      <div key={i} style={{
                        background: 'rgba(216, 195, 165, 0.3)',
                        borderLeft: '4px solid var(--color-burgundy)',
                        padding: '10px 14px',
                        borderRadius: '0 6px 6px 0',
                        fontSize: '0.85rem'
                      }}>
                        <strong>[{r.priority}] {r.title}:</strong> {r.message}
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>

            {/* Model Selector Bar */}
            <div style={{
              display: 'flex',
              alignItems: 'center',
              gap: '12px',
              marginBottom: '20px',
              background: 'var(--color-cream)',
              border: '1px solid var(--color-warm-beige)',
              padding: '10px 16px',
              borderRadius: '8px'
            }}>
              <span style={{ fontSize: '0.84rem', fontWeight: 700, fontFamily: 'var(--font-heading)' }}>
                AUDIT MODEL:
              </span>
              <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
                {models.map(m => (
                  <button
                    key={m.id}
                    onClick={() => {
                      setActiveModel(m.id);
                      runAudit(selectedDataset, m.id);
                    }}
                    style={{
                      background: activeModel === m.id ? 'var(--color-burgundy)' : 'var(--color-warm-beige)',
                      color: activeModel === m.id ? 'var(--color-cream)' : 'var(--color-dark-chocolate)',
                      border: `1px solid ${activeModel === m.id ? 'var(--color-burgundy)' : 'var(--color-coffee-brown)'}`,
                      padding: '6px 12px',
                      borderRadius: '6px',
                      fontSize: '0.82rem',
                      fontWeight: 700,
                      cursor: 'pointer'
                    }}
                  >
                    {m.name}
                  </button>
                ))}
              </div>
            </div>

            {/* Tab Navigation */}
            <div style={{
              display: 'flex',
              gap: '8px',
              overflowX: 'auto',
              borderBottom: '2px solid var(--color-warm-beige)',
              paddingBottom: '8px',
              marginBottom: '24px'
            }}>
              {[
                { id: 'performance', label: '1. CLASSIFICATION & METRICS' },
                { id: 'fairness', label: '2. FAIRNESS & DISPARITY' },
                { id: 'explainability', label: '3. EXPLAINABILITY (SHAP)' },
                { id: 'drift', label: '4. DATA DRIFT (PSI/KS)' },
                { id: 'privacy', label: '5. PRIVACY & PII SCAN' },
                { id: 'governance', label: '6. HUMAN GOVERNANCE' }
              ].map(t => (
                <button
                  key={t.id}
                  onClick={() => setActiveTab(t.id)}
                  style={{
                    background: activeTab === t.id ? 'var(--color-burgundy)' : 'transparent',
                    color: activeTab === t.id ? 'var(--color-cream)' : 'var(--color-dark-chocolate)',
                    border: activeTab === t.id ? '1px solid var(--color-burgundy)' : '1px solid transparent',
                    borderRadius: '8px',
                    padding: '8px 16px',
                    fontWeight: 700,
                    fontSize: '0.85rem',
                    cursor: 'pointer',
                    whiteSpace: 'nowrap'
                  }}
                >
                  {t.label}
                </button>
              ))}
            </div>

            {/* Tab 1: Performance */}
            {activeTab === 'performance' && (
              <div style={{ display: 'flex', flexDirection: 'column', gap: '20px' }}>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))', gap: '14px' }}>
                  {[
                    { label: 'ACCURACY', val: (assessment.metrics.accuracy * 100).toFixed(1) + '%' },
                    { label: 'ROC-AUC', val: assessment.metrics.roc_auc.toFixed(3) },
                    { label: 'F1 SCORE', val: assessment.metrics.f1.toFixed(3) },
                    { label: 'PRECISION', val: assessment.metrics.precision.toFixed(3) },
                    { label: 'RECALL', val: assessment.metrics.recall.toFixed(3) },
                    { label: 'LOG LOSS', val: assessment.metrics.log_loss.toFixed(3) }
                  ].map((m, i) => (
                    <div key={i} className="card" style={{ padding: '16px' }}>
                      <span style={{ fontSize: '0.75rem', fontWeight: 700, color: 'var(--color-coffee-brown)' }}>{m.label}</span>
                      <div style={{ fontSize: '1.6rem', fontWeight: 800, fontFamily: 'var(--font-heading)', color: 'var(--color-dark-chocolate)', marginTop: '4px' }}>
                        {m.val}
                      </div>
                    </div>
                  ))}
                </div>

                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(320px, 1fr))', gap: '20px' }}>
                  <div className="card">
                    <h3 style={{ fontSize: '1.05rem', marginBottom: '14px' }}>CONFUSION MATRIX</h3>
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px', textAlign: 'center' }}>
                      <div style={{ background: 'var(--color-warm-beige)', padding: '14px', borderRadius: '6px' }}>
                        <span style={{ fontSize: '0.75rem', fontWeight: 700 }}>TN</span>
                        <div style={{ fontSize: '1.4rem', fontWeight: 800 }}>{assessment.confusion_matrix.tn.toLocaleString()}</div>
                      </div>
                      <div style={{ background: 'rgba(107, 44, 44, 0.1)', padding: '14px', borderRadius: '6px', border: '1px solid var(--color-burgundy)' }}>
                        <span style={{ fontSize: '0.75rem', fontWeight: 700, color: 'var(--color-burgundy)' }}>FP</span>
                        <div style={{ fontSize: '1.4rem', fontWeight: 800, color: 'var(--color-burgundy)' }}>{assessment.confusion_matrix.fp.toLocaleString()}</div>
                      </div>
                      <div style={{ background: 'rgba(107, 44, 44, 0.1)', padding: '14px', borderRadius: '6px', border: '1px solid var(--color-burgundy)' }}>
                        <span style={{ fontSize: '0.75rem', fontWeight: 700, color: 'var(--color-burgundy)' }}>FN</span>
                        <div style={{ fontSize: '1.4rem', fontWeight: 800, color: 'var(--color-burgundy)' }}>{assessment.confusion_matrix.fn.toLocaleString()}</div>
                      </div>
                      <div style={{ background: 'var(--color-warm-beige)', padding: '14px', borderRadius: '6px' }}>
                        <span style={{ fontSize: '0.75rem', fontWeight: 700 }}>TP</span>
                        <div style={{ fontSize: '1.4rem', fontWeight: 800 }}>{assessment.confusion_matrix.tp.toLocaleString()}</div>
                      </div>
                    </div>
                  </div>

                  <div className="card">
                    <h3 style={{ fontSize: '1.05rem', marginBottom: '14px' }}>CALIBRATION & VERIFICATION</h3>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '10px', fontSize: '0.86rem' }}>
                      <div style={{ display: 'flex', justifyContent: 'space-between', borderBottom: '1px solid var(--color-warm-beige)', paddingBottom: '6px' }}>
                        <span>Total Test Samples:</span>
                        <strong>16,000 records</strong>
                      </div>
                      <div style={{ display: 'flex', justifyContent: 'space-between', borderBottom: '1px solid var(--color-warm-beige)', paddingBottom: '6px' }}>
                        <span>Decision Threshold:</span>
                        <strong>0.50</strong>
                      </div>
                      <div style={{ display: 'flex', justifyContent: 'space-between', borderBottom: '1px solid var(--color-warm-beige)', paddingBottom: '6px' }}>
                        <span>False Discovery Rate (FDR):</span>
                        <strong style={{ color: 'var(--color-burgundy)' }}>23.5%</strong>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* Tab 2: Fairness */}
            {activeTab === 'fairness' && (
              <div style={{ display: 'flex', flexDirection: 'column', gap: '20px' }}>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(260px, 1fr))', gap: '16px' }}>
                  <div className="card">
                    <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                      <span style={{ fontSize: '0.78rem', fontWeight: 700, color: 'var(--color-coffee-brown)' }}>DISPARATE IMPACT RATIO</span>
                      <span className="badge" style={{
                        background: assessment.fairness.disparate_impact_ratio >= 0.8 ? 'var(--color-warm-beige)' : 'var(--color-burgundy)',
                        color: assessment.fairness.disparate_impact_ratio >= 0.8 ? 'var(--color-dark-chocolate)' : 'var(--color-cream)'
                      }}>
                        {assessment.fairness.disparate_impact_ratio >= 0.8 ? '80% MET' : 'VIOLATES 80% RULE'}
                      </span>
                    </div>
                    <div style={{ fontSize: '2rem', fontWeight: 800, fontFamily: 'var(--font-heading)', color: assessment.fairness.disparate_impact_ratio >= 0.8 ? 'var(--color-dark-chocolate)' : 'var(--color-burgundy)', margin: '6px 0' }}>
                      {assessment.fairness.disparate_impact_ratio.toFixed(3)}
                    </div>
                    <span style={{ fontSize: '0.78rem', color: 'var(--color-coffee-brown)' }}>
                      EEOC 4/5ths Rule Standard: Ratio must be ≥ 0.80
                    </span>
                  </div>

                  <div className="card">
                    <span style={{ fontSize: '0.78rem', fontWeight: 700, color: 'var(--color-coffee-brown)' }}>DEMOGRAPHIC PARITY DIFF</span>
                    <div style={{ fontSize: '2rem', fontWeight: 800, fontFamily: 'var(--font-heading)', margin: '6px 0' }}>
                      {assessment.fairness.demographic_parity_difference.toFixed(3)}
                    </div>
                    <span style={{ fontSize: '0.78rem', color: 'var(--color-coffee-brown)' }}>
                      Max absolute rate gap across cohorts
                    </span>
                  </div>

                  <div className="card">
                    <span style={{ fontSize: '0.78rem', fontWeight: 700, color: 'var(--color-coffee-brown)' }}>EQUALIZED ODDS DIFF</span>
                    <div style={{ fontSize: '2rem', fontWeight: 800, fontFamily: 'var(--font-heading)', margin: '6px 0' }}>
                      {assessment.fairness.equalized_odds_difference.toFixed(3)}
                    </div>
                    <span style={{ fontSize: '0.78rem', color: 'var(--color-coffee-brown)' }}>
                      Combined TPR & FPR disparity
                    </span>
                  </div>
                </div>

                <div className="card">
                  <h3 style={{ fontSize: '1.1rem', marginBottom: '14px' }}>SELECTION RATE COMPARISON ACROSS GENDER</h3>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '14px' }}>
                    <div>
                      <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.84rem', fontWeight: 600, marginBottom: '4px' }}>
                        <span>Privileged Group (Male)</span>
                        <span>31.5%</span>
                      </div>
                      <div style={{ width: '100%', height: '12px', background: 'var(--color-warm-beige)', borderRadius: '6px', overflow: 'hidden' }}>
                        <div style={{ width: '31.5%', height: '100%', background: 'var(--color-dark-chocolate)' }} />
                      </div>
                    </div>

                    <div>
                      <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.84rem', fontWeight: 600, marginBottom: '4px' }}>
                        <span>Unprivileged Group (Female)</span>
                        <span>11.4%</span>
                      </div>
                      <div style={{ width: '100%', height: '12px', background: 'var(--color-warm-beige)', borderRadius: '6px', overflow: 'hidden' }}>
                        <div style={{ width: '11.4%', height: '100%', background: 'var(--color-burgundy)' }} />
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* Tab 3: Explainability */}
            {activeTab === 'explainability' && (
              <div style={{ display: 'flex', flexDirection: 'column', gap: '20px' }}>
                <div className="card">
                  <h3 style={{ fontSize: '1.1rem', marginBottom: '8px' }}>GLOBAL FEATURE IMPORTANCE (SHAP ATTRIBUTION)</h3>
                  <p style={{ fontSize: '0.82rem', color: 'var(--color-coffee-brown)', marginBottom: '16px' }}>
                    Ranked impact of features on loan/income approvals across the population
                  </p>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                    {[
                      { name: 'capital-gain', val: 0.28 },
                      { name: 'education-num', val: 0.22 },
                      { name: 'age', val: 0.16 },
                      { name: 'hours-per-week', val: 0.12 },
                      { name: 'marital-status', val: 0.09 },
                      { name: 'occupation', val: 0.06 }
                    ].map((f, i) => (
                      <div key={i}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.82rem', fontWeight: 600, marginBottom: '2px' }}>
                          <span>{i + 1}. {f.name}</span>
                          <span>{f.val.toFixed(2)}</span>
                        </div>
                        <div style={{ width: '100%', height: '8px', background: 'var(--color-warm-beige)', borderRadius: '4px', overflow: 'hidden' }}>
                          <div style={{ width: `${(f.val / 0.28) * 100}%`, height: '100%', background: i < 2 ? 'var(--color-burgundy)' : 'var(--color-coffee-brown)' }} />
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="card">
                  <h3 style={{ fontSize: '1.1rem', marginBottom: '10px' }}>LOCAL WATERFALL EXPLANATION (SAMPLE #4102)</h3>
                  <div style={{ background: 'var(--color-warm-beige)', padding: '12px', borderRadius: '6px', marginBottom: '14px', fontSize: '0.86rem' }}>
                    <strong>Profile:</strong> Age: 48, Education: Bachelors, Hours: 45/wk • <strong>Output Probability:</strong> 78.4%
                  </div>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '8px', fontSize: '0.84rem' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', padding: '8px', border: '1px solid var(--color-burgundy)', background: 'rgba(107, 44, 44, 0.08)', borderRadius: '4px' }}>
                      <span>+ capital-gain = $5,000</span>
                      <strong style={{ color: 'var(--color-burgundy)' }}>+28.0%</strong>
                    </div>
                    <div style={{ display: 'flex', justifyContent: 'space-between', padding: '8px', border: '1px solid var(--color-burgundy)', background: 'rgba(107, 44, 44, 0.08)', borderRadius: '4px' }}>
                      <span>+ education-num = 13 (Bachelors)</span>
                      <strong style={{ color: 'var(--color-burgundy)' }}>+18.0%</strong>
                    </div>
                    <div style={{ display: 'flex', justifyContent: 'space-between', padding: '8px', border: '1px solid var(--color-coffee-brown)', background: 'rgba(139, 107, 74, 0.08)', borderRadius: '4px' }}>
                      <span>- marital-status = Never-married</span>
                      <strong style={{ color: 'var(--color-coffee-brown)' }}>-8.0%</strong>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* Tab 4: Drift */}
            {activeTab === 'drift' && (
              <div style={{ display: 'flex', flexDirection: 'column', gap: '20px' }}>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(240px, 1fr))', gap: '14px' }}>
                  <div className="card">
                    <span style={{ fontSize: '0.78rem', fontWeight: 700, color: 'var(--color-coffee-brown)' }}>POPULATION DRIFT STATUS</span>
                    <div style={{ fontSize: '1.8rem', fontWeight: 800, fontFamily: 'var(--font-heading)', color: assessment.drift.overall_drift ? 'var(--color-burgundy)' : 'var(--color-dark-chocolate)', margin: '6px 0' }}>
                      {assessment.drift.overall_drift ? 'DRIFT ALERT' : 'STABLE'}
                    </div>
                    <span style={{ fontSize: '0.78rem', color: 'var(--color-coffee-brown)' }}>Kolmogorov-Smirnov & PSI tests</span>
                  </div>

                  <div className="card">
                    <span style={{ fontSize: '0.78rem', fontWeight: 700, color: 'var(--color-coffee-brown)' }}>MAX PSI (STABILITY INDEX)</span>
                    <div style={{ fontSize: '1.8rem', fontWeight: 800, fontFamily: 'var(--font-heading)', margin: '6px 0' }}>
                      {assessment.drift.max_psi.toFixed(3)}
                    </div>
                    <span style={{ fontSize: '0.78rem', color: 'var(--color-coffee-brown)' }}>Threshold: &lt;0.10 Stable, &gt;0.25 Action</span>
                  </div>
                </div>

                <div className="card" style={{ padding: 0, overflow: 'hidden' }}>
                  <div style={{ padding: '16px 20px', borderBottom: '1px solid var(--color-warm-beige)' }}>
                    <h3 style={{ fontSize: '1.05rem' }}>COVARIATE FEATURE DRIFT TABLE</h3>
                  </div>
                  <table>
                    <thead>
                      <tr>
                        <th>FEATURE</th>
                        <th>PSI</th>
                        <th>STATUS</th>
                      </tr>
                    </thead>
                    <tbody>
                      {assessment.drift.features.map((f, i) => (
                        <tr key={i}>
                          <td style={{ fontWeight: 600 }}>{f.name}</td>
                          <td style={{ fontFamily: 'monospace' }}>{f.psi.toFixed(3)}</td>
                          <td>
                            <span className="badge" style={{ background: f.status === 'STABLE' ? 'var(--color-warm-beige)' : 'var(--color-burgundy)', color: f.status === 'STABLE' ? 'var(--color-dark-chocolate)' : 'var(--color-cream)' }}>
                              {f.status}
                            </span>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* Tab 5: Privacy */}
            {activeTab === 'privacy' && (
              <div style={{ display: 'flex', flexDirection: 'column', gap: '20px' }}>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(240px, 1fr))', gap: '14px' }}>
                  <div className="card">
                    <span style={{ fontSize: '0.78rem', fontWeight: 700, color: 'var(--color-coffee-brown)' }}>PII LEAK STATUS</span>
                    <div style={{ fontSize: '1.8rem', fontWeight: 800, fontFamily: 'var(--font-heading)', color: assessment.privacy.pii_leaks > 0 ? 'var(--color-burgundy)' : 'var(--color-dark-chocolate)', margin: '6px 0' }}>
                      {assessment.privacy.pii_leaks === 0 ? '0 LEAKS' : `${assessment.privacy.pii_leaks} DETECTED`}
                    </div>
                    <span style={{ fontSize: '0.78rem', color: 'var(--color-coffee-brown)' }}>Regex scan of SSN, Emails, Cards</span>
                  </div>

                  <div className="card">
                    <span style={{ fontSize: '0.78rem', fontWeight: 700, color: 'var(--color-coffee-brown)' }}>k-ANONYMITY</span>
                    <div style={{ fontSize: '1.8rem', fontWeight: 800, fontFamily: 'var(--font-heading)', margin: '6px 0' }}>
                      k = {assessment.privacy.k_anonymity_min}
                    </div>
                    <span style={{ fontSize: '0.78rem', color: 'var(--color-coffee-brown)' }}>Minimum quasi-identifier cluster</span>
                  </div>

                  <div className="card">
                    <span style={{ fontSize: '0.78rem', fontWeight: 700, color: 'var(--color-coffee-brown)' }}>MIA MEMORIZATION GAP</span>
                    <div style={{ fontSize: '1.8rem', fontWeight: 800, fontFamily: 'var(--font-heading)', margin: '6px 0' }}>
                      Δ {assessment.privacy.mia_delta_auc.toFixed(3)}
                    </div>
                    <span style={{ fontSize: '0.78rem', color: 'var(--color-coffee-brown)' }}>Train vs Test AUC gap</span>
                  </div>
                </div>

                <div className="card">
                  <h3 style={{ fontSize: '1.05rem', marginBottom: '10px' }}>QUASI-IDENTIFIER ATTRIBUTES</h3>
                  <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
                    {['age', 'workclass', 'education', 'native-country'].map((qi, i) => (
                      <span key={i} style={{ background: 'var(--color-warm-beige)', padding: '4px 10px', borderRadius: '4px', fontSize: '0.82rem', fontWeight: 600 }}>
                        {qi}
                      </span>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* Tab 6: Governance */}
            {activeTab === 'governance' && (
              <div style={{ display: 'flex', flexDirection: 'column', gap: '20px' }}>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(320px, 1fr))', gap: '20px' }}>
                  <div className="card">
                    <h3 style={{ fontSize: '1.1rem', marginBottom: '8px' }}>HUMAN-IN-THE-LOOP VERIFICATION</h3>
                    <form onSubmit={handleAddReview} style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
                      <div>
                        <label style={{ fontSize: '0.8rem', fontWeight: 700, display: 'block', marginBottom: '4px' }}>REVIEWER:</label>
                        <input name="reviewer" defaultValue="Dr. S. Kulkarni (Ethics Lead)" className="text-input" required />
                      </div>
                      <div>
                        <label style={{ fontSize: '0.8rem', fontWeight: 700, display: 'block', marginBottom: '4px' }}>VERDICT:</label>
                        <select name="decision" className="select-input" style={{ width: '100%' }}>
                          <option value="APPROVED">APPROVED (Authorized for Production)</option>
                          <option value="FLAGGED">FLAGGED (Conditional with Mitigation)</option>
                          <option value="REJECTED">REJECTED (Unacceptable Risk)</option>
                        </select>
                      </div>
                      <div>
                        <label style={{ fontSize: '0.8rem', fontWeight: 700, display: 'block', marginBottom: '4px' }}>JUSTIFICATION NOTES:</label>
                        <textarea name="notes" rows={3} className="text-input" defaultValue="Model metrics satisfy baseline; approved with ongoing drift monitoring." />
                      </div>
                      <button type="submit" className="btn-primary" style={{ justifyContent: 'center' }}>
                        COMMIT AUDIT DECISION
                      </button>
                    </form>
                  </div>

                  <div className="card">
                    <h3 style={{ fontSize: '1.1rem', marginBottom: '8px' }}>AUDIT REPORTS & MODEL CARD</h3>
                    <p style={{ fontSize: '0.82rem', color: 'var(--color-coffee-brown)', marginBottom: '14px' }}>
                      Download compliance certificates generated for regulatory audit.
                    </p>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                      <a href={`/report?assessment_id=${assessment.assessment_id}&format=json`} target="_blank" className="btn-secondary" style={{ justifyContent: 'center' }}>
                        DOWNLOAD COMPLIANCE REPORT (JSON)
                      </a>
                      <a href={`/report?assessment_id=${assessment.assessment_id}&format=html`} target="_blank" className="btn-dark" style={{ justifyContent: 'center' }}>
                        EXPORT EXECUTIVE MODEL CARD (HTML)
                      </a>
                    </div>
                  </div>
                </div>

                <div className="card" style={{ padding: 0, overflow: 'hidden' }}>
                  <div style={{ padding: '16px 20px', borderBottom: '1px solid var(--color-warm-beige)' }}>
                    <h3 style={{ fontSize: '1.05rem' }}>AUDIT LOG TRAIL</h3>
                  </div>
                  <table>
                    <thead>
                      <tr>
                        <th>TIMESTAMP</th>
                        <th>REVIEWER</th>
                        <th>VERDICT</th>
                        <th>NOTES</th>
                      </tr>
                    </thead>
                    <tbody>
                      {reviewHistory.map((r, i) => (
                        <tr key={i}>
                          <td style={{ fontFamily: 'monospace', fontSize: '0.78rem' }}>{r.created_at}</td>
                          <td style={{ fontWeight: 700 }}>{r.reviewer}</td>
                          <td>
                            <span className="badge" style={{
                              background: r.decision === 'APPROVED' ? 'var(--color-dark-chocolate)' : (r.decision === 'REJECTED' ? 'var(--color-burgundy)' : 'var(--color-coffee-brown)'),
                              color: 'var(--color-cream)'
                            }}>
                              {r.decision}
                            </span>
                          </td>
                          <td style={{ fontSize: '0.84rem' }}>{r.notes}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}
          </main>

          <footer style={{
            background: 'var(--color-dark-chocolate)',
            color: 'var(--color-warm-beige)',
            textAlign: 'center',
            padding: '20px',
            fontSize: '0.8rem',
            borderTop: '2px solid var(--color-burgundy)',
            marginTop: '40px'
          }}>
            FairGuard AI Platform • Department of Artificial Intelligence & Data Science • Strict "Vintage Soul" Governance Edition
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<FairGuardApp />);
  </script>
</body>
</html>
